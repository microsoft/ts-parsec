name: CI
on: [push, pull_request]
jobs:
  PR:
    name: Validation
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn test